# fuzzel — application launcher (SUPER+SPACE)
# Catppuccin palette; colors are RRGGBBAA (no leading #).

font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt="  "
width=45
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=8
line-height=22

[colors]
background=1e1e28e6
text=dadae8ff
match=a4b9efff
selection=332e41ff
selection-text=dadae8ff
selection-match=c6aae8ff
border=a4b9efff

[border]
width=2
radius=8

[dmenu]
exit-immediately-if-empty=yes
