# Window & layer rules
#
# Ported in spirit from the macOS yabai rules: dialogs, preference panes and
# IDE popups should float rather than be forced into the tiling tree.

# --- Float dialogs and utility windows generically ---
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float, class:^(pavucontrol|nm-connection-editor|blueman-manager)$
windowrulev2 = float, class:^(nwg-look|qt5ct|qt6ct)$
windowrulev2 = float, title:^(Open File|Save File|Save As|Open Folder)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin,   title:^(Picture-in-Picture)$

# --- JetBrains / IntelliJ ---
# Equivalent of the yabai `manage=off` rules. IntelliJ's splash, project
# structure and settings windows tile badly; float them.
windowrulev2 = float, class:^(jetbrains-.*)$, title:^$
windowrulev2 = float, class:^(jetbrains-.*)$, title:^(Project Structure|Settings|Preferences|Edit configuration.*)$
windowrulev2 = float, class:^(jetbrains-toolbox)$
# IntelliJ autocomplete popups must never be tiled or focus-stolen.
windowrulev2 = noinitialfocus, class:^(jetbrains-.*)$, floating:1, title:^(win.*)$
windowrulev2 = nofocus,        class:^(jetbrains-.*)$, floating:1, title:^(win.*)$

# --- File manager ---
windowrulev2 = float, class:^(org.gnome.Nautilus)$, title:^(Properties|Preferences)$

# --- 1Password / secrets: never allow screen capture ---
windowrulev2 = noscreencopy, class:^(1Password)$

# --- Scratchpad terminal sizing ---
windowrulev2 = float, workspace:special:magic
windowrulev2 = size 70% 70%, workspace:special:magic
windowrulev2 = center, workspace:special:magic

# --- Layer rules: blur the shell surfaces ---
layerrule = blur, waybar
layerrule = blur, fuzzel
layerrule = blur, notifications
layerrule = ignorezero, waybar
layerrule = ignorezero, fuzzel
layerrule = ignorezero, notifications
