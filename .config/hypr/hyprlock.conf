# hyprlock — lock screen
# Catppuccin palette, matching .tmux.conf and looknfeel.conf.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(1e1e28ff)
    blur_passes = 0
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(a4b9efff)
    inner_color = rgba(332e41ff)
    font_color  = rgba(dadae8ff)

    fade_on_empty = false
    placeholder_text = <span foreground="##575268">Password</span>

    check_color = rgba(ebddaaff)
    fail_color  = rgba(e38c8fff)
    fail_text   = <span foreground="##e38c8f">$FAIL ($ATTEMPTS)</span>

    position = 0, -40
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(dadae8ff)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(575268ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}
