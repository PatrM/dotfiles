# Look & feel
#
# Palette is Catppuccin, carried over verbatim from ~/.tmux.conf so the
# desktop, terminal multiplexer and lock screen share one color scheme.
#   bg #1e1e28   fg #dadae8   gray #332e41   black4 #575268
#   blue #a4b9ef  magenta #c6aae8  pink #e5b4e2  cyan #c2e7f0
#   red #e38c8f   green #b1e3ad    yellow #ebddaa  orange #f9c096

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = rgba(a4b9efee) rgba(c6aae8ee) 45deg
    col.inactive_border = rgba(332e41aa)

    # Dwindle = binary split tree. This is the closest analogue to the
    # `layout bsp` used in the macOS yabai config, so window-splitting
    # instincts carry over.
    layout = dwindle

    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 8

    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        # Blurs the bar, launcher and notifications (layer surfaces),
        # not just windows.
        xray = false
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(15121caa)
    }
}

animations {
    enabled = true

    # Curve names are arbitrary labels; the four numbers are a cubic bezier.
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1

    # Durations are in tens of milliseconds (7 = 70ms).
    # Tuned to read as "smooth but not slow" — nothing here should ever make
    # you wait on the animation to finish before the window is usable.
    animation = global, 1, 7, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = workspaces, 1, 1.94, almostLinear, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
    # New window takes the second half of the split — same convention as
    # yabai's `window_placement second_child`.
    force_split = 2
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true          # variable frame rate — saves GPU when idle
    vrr = 0             # display is VRR-incapable; see monitors.conf
    focus_on_activate = true
    animate_manual_resizes = false
}
