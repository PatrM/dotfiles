# Monitors
#
# Syntax: monitor = name, resolution@refresh, position, scale
#
# Refresh rate is pinned explicitly on purpose. The panel advertises several
# modes (60 / 100 / 120 / 144); "preferred" does not reliably pick the fastest
# one, so naming 143.91 avoids silently running at 60Hz.
monitor = HDMI-A-1, 2560x1440@143.91, 0x0, 1

# Catch-all for any monitor plugged in later (dock, projector, second screen).
# Places it to the right of the main display at its own preferred mode.
monitor = , preferred, auto, 1

# NOTE: this display reports "Vrr: incapable" (verified via kscreen-doctor).
# Do not enable VRR/adaptive sync here — it will do nothing at best.
# If you swap in a monitor that supports it, add:  misc { vrr = 1 }
