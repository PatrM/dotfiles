# Input devices

input {
    # Verified against `localectl status` (X11 Layout: us). The system locale
    # is de_DE for time/currency/paper, but the physical layout is US.
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    # Matches the macOS/yabai setup, where focus_follows_mouse was off.
    # 1 = focus follows mouse, but keyboard focus wins on click.
    # Set to 0 for strict click-to-focus.

    sensitivity = 0
    numlock_by_default = true

    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# Mouse-drag window management.
# Mirrors the yabai config: ALT + drag to move, ALT + right-drag to resize.
# Kept on ALT rather than SUPER precisely because that is the existing
# muscle memory from macOS.
bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow
