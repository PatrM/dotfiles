# Hyprland — top-level config
#
# This file only sources the modules below. Keep it that way: every real
# setting belongs in a topic file so changes stay reviewable in git.
#
# Agents: read AGENTS.md in this directory before editing anything here.

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/autostart.conf

# Local, uncommitted overrides. Optional — see AGENTS.md.
# Anything machine-specific (a second monitor at the office, a work-only
# keybind) goes here so it never lands in the repo.
source = ~/.config/hypr/local.conf
