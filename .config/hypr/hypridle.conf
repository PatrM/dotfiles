# hypridle — idle behaviour
#
# NOTE (NVIDIA): suspend/resume is the known soft spot on this hardware.
# `dpms off` is safe, but if waking from suspend ever produces a black screen
# or a dead session, comment out the suspend listener below and re-test —
# that isolates whether the problem is hypridle or the driver.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid stacking lock screens
    before_sleep_cmd = loginctl lock-session    # lock before suspending
    after_sleep_cmd = hyprctl dispatch dpms on  # force display on after wake
}

# 5 min — lock the session
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 min — turn the display off
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 min — suspend.
# Commented out by default: this is a desktop with an RTX 4070, not a laptop,
# so there is no battery reason to suspend, and NVIDIA resume is the riskiest
# path in this whole setup. Enable deliberately if you want it.
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
