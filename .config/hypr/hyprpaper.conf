# hyprpaper — wallpaper daemon
#
# No image is set by default; the Catppuccin background color from
# looknfeel.conf shows through. To use an actual wallpaper, uncomment and
# point at a real file:
#
#   preload = ~/Pictures/wallpapers/bg.png
#   wallpaper = HDMI-A-1, ~/Pictures/wallpapers/bg.png
#
# `contain:` or `cover:` prefixes control scaling, e.g.
#   wallpaper = HDMI-A-1, cover:~/Pictures/wallpapers/bg.png

splash = false
ipc = on
