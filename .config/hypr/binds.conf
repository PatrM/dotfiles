# Keybindings
#
# Modifier choice: SUPER is the main modifier. On Linux it is essentially
# unused by applications, unlike macOS where CMD is heavily taken — so it
# gives a conflict-free namespace. ALT is reserved for mouse drag actions
# (see input.conf) to preserve the yabai muscle memory.
#
# Directional keys are h/j/k/l everywhere, matching the vim bindings already
# used in .tmux.conf (bind h/j/k/l select-pane), nvim, helix and .ideavimrc.

$mainMod = SUPER

# Programs. Change these two lines to swap terminal/browser everywhere.
$terminal = kitty
$fileManager = nautilus
$menu = fuzzel

# --- Core ---
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo          # dwindle pseudotile
bind = $mainMod, J, togglesplit     # dwindle: flip split axis
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1   # maximize, keep bar visible

# Exit compositor. SHIFT+M to make it hard to hit by accident.
bind = $mainMod SHIFT, M, exit

# --- Focus movement (vim keys) ---
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# Arrow keys work too, for when the hands are already off home row.
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- Moving windows ---
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r

# --- Resizing (repeatable: hold the keys down) ---
binde = $mainMod CTRL, h, resizeactive, -40 0
binde = $mainMod CTRL, j, resizeactive, 0 40
binde = $mainMod CTRL, k, resizeactive, 0 -40
binde = $mainMod CTRL, l, resizeactive, 40 0

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Cycle workspaces with the scroll wheel
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Scratchpad (Hyprland calls it the "special" workspace)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# --- Screenshots ---
# Region to clipboard
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy
# Whole screen to file
bind = SHIFT, PRINT, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# --- Clipboard history ---
bind = $mainMod, C, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# --- Lock / idle ---
bind = $mainMod SHIFT, L, exec, hyprlock

# --- Media & volume keys ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
